<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nivash M — AI & ML Engineer animated profile banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Animated name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="40%" stop-color="#58A6FF"/>
      <stop offset="80%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#00D4AA"/>
      <animate attributeName="x1" values="0%;60%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;160%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow radials -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <style>
      /* Particles */
      .p { animation: drift linear infinite; }
      @keyframes drift {
        0%   { transform: translateY(0px) translateX(0px); opacity: 0.7; }
        25%  { transform: translateY(-20px) translateX(12px); opacity: 1; }
        50%  { transform: translateY(-8px) translateX(22px); opacity: 0.5; }
        75%  { transform: translateY(14px) translateX(8px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.7; }
      }
      /* Underline draw */
      .underline { animation: extend 2s ease-out 0.3s both; }
      @keyframes extend { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
      /* Role fade in */
      .role { animation: fadeUp 1s ease-out 0.6s both; }
      /* Badges fade in */
      .badge { animation: fadeUp 1s ease-out both; }
      .badge.b2 { animation-delay: 0.9s; }
      .badge.b3 { animation-delay: 1.1s; }
      .badge.b4 { animation-delay: 1.3s; }
      @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
      /* Pulse ring */
      .ring { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:0.4; r:190px; } 50% { opacity:0.08; r:210px; } }
      /* Circuit lines blink */
      .circ { animation: blink 4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 0.08; } 50% { opacity: 0.18; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Glow orbs -->
  <circle cx="1050" cy="80" r="200" fill="url(#glow2)"/>
  <circle cx="150" cy="230" r="170" fill="url(#glow1)"/>
  <circle cx="600" cy="150" r="220" fill="url(#glow3)" opacity="0.4"/>

  <!-- Animated pulse ring -->
  <circle class="ring" cx="600" cy="150" r="190" fill="none" stroke="#00D4AA" stroke-width="1"/>

  <!-- Circuit decorative lines -->
  <g class="circ">
    <line x1="0" y1="80" x2="280" y2="80" stroke="#00D4AA" stroke-width="1"/>
    <line x1="280" y1="80" x2="320" y2="120" stroke="#00D4AA" stroke-width="1"/>
    <circle cx="280" cy="80" r="3" fill="#00D4AA"/>
    <line x1="920" y1="220" x2="1200" y2="220" stroke="#58A6FF" stroke-width="1"/>
    <line x1="880" y1="180" x2="920" y2="220" stroke="#58A6FF" stroke-width="1"/>
    <circle cx="920" cy="220" r="3" fill="#58A6FF"/>
    <line x1="40" y1="240" x2="180" y2="240" stroke="#A371F7" stroke-width="1"/>
    <circle cx="40" cy="240" r="2" fill="#A371F7"/>
    <line x1="1020" y1="60" x2="1160" y2="60" stroke="#A371F7" stroke-width="1"/>
    <circle cx="1160" cy="60" r="2" fill="#A371F7"/>
  </g>

  <!-- Floating particles -->
  <circle class="p" cx="90"  cy="70"  r="3.5" fill="#00D4AA" style="animation-duration:7s;animation-delay:-1s"/>
  <circle class="p" cx="1100" cy="210" r="4"   fill="#58A6FF" style="animation-duration:9s;animation-delay:-3s"/>
  <circle class="p" cx="980" cy="55"  r="2.5" fill="#A371F7" style="animation-duration:5.5s;animation-delay:-4s"/>
  <circle class="p" cx="200" cy="240" r="3"   fill="#00D4AA" style="animation-duration:8s;animation-delay:-2s"/>
  <circle class="p" cx="720" cy="35"  r="2"   fill="#58A6FF" style="animation-duration:6.5s;animation-delay:-5s"/>
  <circle class="p" cx="55"  cy="160" r="2"   fill="#A371F7" style="animation-duration:10s;animation-delay:-6s"/>
  <circle class="p" cx="850" cy="270" r="2.5" fill="#00D4AA" style="animation-duration:7.5s;animation-delay:-2.5s"/>
  <circle class="p" cx="370" cy="25"  r="2"   fill="#A371F7" style="animation-duration:9s;animation-delay:-1.5s"/>
  <circle class="p" cx="1140" cy="130" r="3"  fill="#00D4AA" style="animation-duration:6s;animation-delay:-7s"/>
  <circle class="p" cx="500" cy="280" r="2"   fill="#58A6FF" style="animation-duration:8.5s;animation-delay:-4.5s"/>

  <!-- Name -->
  <text x="600" y="135" text-anchor="middle"
        font-family="'JetBrains Mono','Segoe UI',monospace"
        font-size="68" font-weight="700"
        fill="url(#nameGrad)">Nivash M</text>

  <!-- Animated underline -->
  <line class="underline" x1="360" y1="158" x2="840" y2="158"
        stroke="url(#nameGrad)" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520"/>

  <!-- Role subtitle -->
  <text class="role" x="600" y="200" text-anchor="middle"
        font-family="'Segoe UI',sans-serif" font-size="20" fill="#8b949e"
        letter-spacing="1">
    AI &amp; ML Engineer · Full-Stack Developer · Open-Source Builder
  </text>

  <!-- Badges row -->
  <g class="badge">
    <!-- Hackathon badge -->
    <rect x="340" y="222" rx="10" ry="10" width="178" height="32" fill="#161b22" stroke="#00D4AA" stroke-width="1" opacity="0.9"/>
    <text x="429" y="243" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#00D4AA">🏆 Hackathon 2nd Prize ₹10k</text>
  </g>
  <g class="badge b2">
    <rect x="530" y="222" rx="10" ry="10" width="140" height="32" fill="#161b22" stroke="#58A6FF" stroke-width="1" opacity="0.9"/>
    <text x="600" y="243" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#58A6FF">🌐 Open to Internships</text>
  </g>
  <g class="badge b3">
    <rect x="682" y="222" rx="10" ry="10" width="178" height="32" fill="#161b22" stroke="#A371F7" stroke-width="1" opacity="0.9"/>
    <text x="771" y="243" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#A371F7">🤖 AI/ML · FastAPI · React</text>
  </g>
</svg>
