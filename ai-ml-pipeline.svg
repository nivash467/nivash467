<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI/ML Production Pipeline">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .node-box { animation: glow-pulse 3s ease-in-out infinite alternate; }
      @keyframes glow-pulse { from { filter: drop-shadow(0 0 4px #00D4AA88); } to { filter: drop-shadow(0 0 10px #00D4AACC); } }
      .arrow-path { animation: flow 2s linear infinite; stroke-dasharray: 8 4; }
      .arrow-path.a2 { animation-delay: -0.7s; }
      .arrow-path.a3 { animation-delay: -1.4s; }
      .arrow-path.a4 { animation-delay: -0.35s; }
      .arrow-path.a5 { animation-delay: -1.05s; }
      @keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
      .stage-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .stage-title { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 13px; }
    </style>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)" rx="12"/>

  <!-- Stage 1: Data Ingestion -->
  <g class="node-box" transform="translate(30,60)">
    <rect width="155" height="80" rx="10" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" class="stage-label" fill="#00D4AA">① INGEST</text>
    <text x="78" y="42" text-anchor="middle" class="stage-title" fill="#e6edf3">Data Sources</text>
    <text x="78" y="58" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">CSV · API · SQL · JSON</text>
    <text x="78" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Pandas · SQLite</text>
  </g>

  <!-- Arrow 1→2 -->
  <line class="arrow-path a1" x1="185" y1="100" x2="218" y2="100" stroke="#00D4AA" stroke-width="2"/>
  <polygon points="218,96 226,100 218,104" fill="#00D4AA"/>

  <!-- Stage 2: Preprocessing -->
  <g class="node-box" transform="translate(226,60)">
    <rect width="155" height="80" rx="10" fill="#111827" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" class="stage-label" fill="#58A6FF">② PROCESS</text>
    <text x="78" y="42" text-anchor="middle" class="stage-title" fill="#e6edf3">Preprocessing</text>
    <text x="78" y="58" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">NLP · OpenCV · NumPy</text>
    <text x="78" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Feature Engineering</text>
  </g>

  <!-- Arrow 2→3 -->
  <line class="arrow-path a2" x1="381" y1="100" x2="414" y2="100" stroke="#58A6FF" stroke-width="2"/>
  <polygon points="414,96 422,100 414,104" fill="#58A6FF"/>

  <!-- Stage 3: Training -->
  <g class="node-box" transform="translate(422,60)">
    <rect width="155" height="80" rx="10" fill="#130f1f" stroke="#A371F7" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" class="stage-label" fill="#A371F7">③ TRAIN</text>
    <text x="78" y="42" text-anchor="middle" class="stage-title" fill="#e6edf3">Model Training</text>
    <text x="78" y="58" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">scikit-learn · TensorFlow</text>
    <text x="78" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">GridSearchCV · Cross-Val</text>
  </g>

  <!-- Arrow 3→4 -->
  <line class="arrow-path a3" x1="577" y1="100" x2="610" y2="100" stroke="#A371F7" stroke-width="2"/>
  <polygon points="610,96 618,100 610,104" fill="#A371F7"/>

  <!-- Stage 4: Evaluate -->
  <g class="node-box" transform="translate(618,60)">
    <rect width="155" height="80" rx="10" fill="#0f1a1a" stroke="#00D4AA" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" class="stage-label" fill="#00D4AA">④ EVALUATE</text>
    <text x="78" y="42" text-anchor="middle" class="stage-title" fill="#e6edf3">Metrics &amp; Testing</text>
    <text x="78" y="58" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Accuracy · F1 · BLEU</text>
    <text x="78" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Confusion Matrix</text>
  </g>

  <!-- Arrow 4→5 -->
  <line class="arrow-path a4" x1="773" y1="100" x2="806" y2="100" stroke="#58A6FF" stroke-width="2"/>
  <polygon points="806,96 814,100 806,104" fill="#58A6FF"/>

  <!-- Stage 5: Deploy -->
  <g class="node-box" transform="translate(814,60)">
    <rect width="155" height="80" rx="10" fill="#111827" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" class="stage-label" fill="#58A6FF">⑤ DEPLOY</text>
    <text x="78" y="42" text-anchor="middle" class="stage-title" fill="#e6edf3">API &amp; Frontend</text>
    <text x="78" y="58" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">FastAPI · Flask · React</text>
    <text x="78" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Vercel · Cloud</text>
  </g>

  <!-- Arrow 5→6 -->
  <line class="arrow-path a5" x1="969" y1="100" x2="1002" y2="100" stroke="#00D4AA" stroke-width="2"/>
  <polygon points="1002,96 1010,100 1002,104" fill="#00D4AA"/>

  <!-- Stage 6: Monitor -->
  <g class="node-box" transform="translate(1010,60)">
    <rect width="155" height="80" rx="10" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.5"/>
    <text x="78" y="22" text-anchor="middle" class="stage-label" fill="#00D4AA">⑥ MONITOR</text>
    <text x="78" y="42" text-anchor="middle" class="stage-title" fill="#e6edf3">Production Loop</text>
    <text x="78" y="58" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Logs · Alerts · Drift</text>
    <text x="78" y="72" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8b949e">Retrain Trigger</text>
  </g>

  <!-- Feedback loop arc -->
  <path d="M 1165 60 Q 1185 10 600 10 Q 15 10 35 60"
        fill="none" stroke="#A371F7" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="600" y="9" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#A371F7" opacity="0.7">← feedback &amp; retrain loop →</text>
</svg>
