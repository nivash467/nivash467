<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI ML production pipeline diagram">
  <defs>
    <style>
      .stage { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .stageTitle { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #e6edf3; }
      .stageSub { font-family: 'Segoe UI', sans-serif; font-size: 10.5px; fill: #8b949e; }
      .arrow { fill: none; stroke: #30363d; stroke-width: 2; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#484f58"/>
    </marker>
  </defs>

  <path class="arrow" d="M 155 110 H 205" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 355 110 H 405" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 555 110 H 605" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 755 110 H 805" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 955 110 H 1005" marker-end="url(#arrowhead)"/>

  <circle class="pulse" cx="180" cy="110" r="3" fill="#00D4AA"/>
  <circle class="pulse" cx="380" cy="110" r="3" fill="#00D4AA"/>
  <circle class="pulse" cx="580" cy="110" r="3" fill="#58A6FF"/>
  <circle class="pulse" cx="780" cy="110" r="3" fill="#58A6FF"/>
  <circle class="pulse" cx="980" cy="110" r="3" fill="#A371F7"/>

  <g>
    <rect class="stage" x="15" y="70" width="140" height="80" rx="10"/>
    <text class="stageTitle" x="85" y="100" text-anchor="middle">Data</text>
    <text class="stageTitle" x="85" y="118" text-anchor="middle">Ingestion</text>
    <text class="stageSub" x="85" y="136" text-anchor="middle">CSV · APIs · Scraping</text>
  </g>

  <g>
    <rect class="stage" x="215" y="70" width="140" height="80" rx="10"/>
    <text class="stageTitle" x="285" y="100" text-anchor="middle">Preprocessing</text>
    <text class="stageSub" x="285" y="120" text-anchor="middle">Pandas · NumPy</text>
    <text class="stageSub" x="285" y="134" text-anchor="middle">NLP cleaning</text>
  </g>

  <g>
    <rect class="stage" x="415" y="70" width="140" height="80" rx="10"/>
    <text class="stageTitle" x="485" y="100" text-anchor="middle">Model</text>
    <text class="stageTitle" x="485" y="118" text-anchor="middle">Training</text>
    <text class="stageSub" x="485" y="136" text-anchor="middle">scikit-learn</text>
  </g>

  <g>
    <rect class="stage" x="615" y="70" width="140" height="80" rx="10"/>
    <text class="stageTitle" x="685" y="100" text-anchor="middle">Evaluation</text>
    <text class="stageSub" x="685" y="120" text-anchor="middle">Precision / Recall</text>
    <text class="stageSub" x="685" y="134" text-anchor="middle">Confusion Matrix</text>
  </g>

  <g>
    <rect class="stage" x="815" y="70" width="140" height="80" rx="10"/>
    <text class="stageTitle" x="885" y="100" text-anchor="middle">API</text>
    <text class="stageTitle" x="885" y="118" text-anchor="middle">Serving</text>
    <text class="stageSub" x="885" y="136" text-anchor="middle">FastAPI</text>
  </g>

  <g>
    <rect class="stage" x="1015" y="70" width="170" height="80" rx="10"/>
    <text class="stageTitle" x="1100" y="100" text-anchor="middle">Deployment</text>
    <text class="stageSub" x="1100" y="120" text-anchor="middle">SQLite / DB</text>
    <text class="stageSub" x="1100" y="134" text-anchor="middle">Client integration</text>
  </g>
</svg>
