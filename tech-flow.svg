<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="animated technology stack flow">
  <defs>
    <style>
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
      .sub { font-family: 'Segoe UI', sans-serif; font-size: 10px; fill: #8b949e; }
      .path { fill: none; stroke: #30363d; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- connectors -->
  <path id="p1" class="path" d="M 130 100 H 330"/>
  <path id="p2" class="path" d="M 430 100 H 630"/>
  <path id="p3" class="path" d="M 730 100 H 930"/>
  <path id="p4" class="path" d="M 1030 100 H 1170"/>

  <!-- traveling dots -->
  <circle r="4" fill="#00D4AA"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="4" fill="#58A6FF"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="4" fill="#A371F7"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="4" fill="#00D4AA"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>

  <!-- nodes -->
  <rect class="node" x="30" y="65" width="100" height="70" rx="10"/>
  <text class="label" x="80" y="97" text-anchor="middle">Languages</text>
  <text class="sub" x="80" y="114" text-anchor="middle">Python · JS</text>

  <rect class="node" x="330" y="65" width="100" height="70" rx="10"/>
  <text class="label" x="380" y="97" text-anchor="middle">Frontend</text>
  <text class="sub" x="380" y="114" text-anchor="middle">React · CSS</text>

  <rect class="node" x="630" y="65" width="100" height="70" rx="10"/>
  <text class="label" x="680" y="97" text-anchor="middle">Backend</text>
  <text class="sub" x="680" y="114" text-anchor="middle">FastAPI</text>

  <rect class="node" x="930" y="65" width="100" height="70" rx="10"/>
  <text class="label" x="980" y="90" text-anchor="middle">ML / Data</text>
  <text class="sub" x="980" y="105" text-anchor="middle">sklearn</text>
  <text class="sub" x="980" y="118" text-anchor="middle">TensorFlow</text>

  <rect class="node" x="1170" y="65" width="0" height="0"/>
  <circle cx="1170" cy="100" r="26" class="node"/>
  <text class="label" x="1170" y="104" text-anchor="middle">DB</text>
</svg>
