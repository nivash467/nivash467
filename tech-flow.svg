<svg viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology stack flow">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <style>
      .chip { animation: chipIn 0.6s ease-out both; }
      .chip:hover rect { stroke-width: 2.5; }
      @keyframes chipIn { from { opacity:0; transform:scale(0.8) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
      .scroll { animation: slideLeft 25s linear infinite; }
      @keyframes slideLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      .label { font-family: 'JetBrains Mono',monospace; font-size: 11px; font-weight: 600; }
      .row-label { font-family: 'Segoe UI',sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="160" fill="url(#bg)" rx="12"/>

  <!-- Row labels -->
  <text x="10" y="52" class="row-label" fill="#00D4AA" transform="rotate(-90,10,52)" text-anchor="middle">AI/ML</text>
  <text x="10" y="108" class="row-label" fill="#58A6FF" transform="rotate(-90,10,108)" text-anchor="middle">WEB</text>

  <!-- Clip mask so chips scroll within bounds -->
  <clipPath id="clip1"><rect x="28" y="10"  width="1160" height="62" rx="4"/></clipPath>
  <clipPath id="clip2"><rect x="28" y="80" width="1160" height="70" rx="4"/></clipPath>

  <!-- Row 1: AI/ML chips -->
  <g clip-path="url(#clip1)">
    <g class="scroll">
      <!-- First set -->
      <g>
        <rect x="30"  y="18" width="90" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="75"  y="40" text-anchor="middle" class="label" fill="#00D4AA">Python</text>

        <rect x="135" y="18" width="110" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="190" y="40" text-anchor="middle" class="label" fill="#00D4AA">scikit-learn</text>

        <rect x="260" y="18" width="120" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="320" y="40" text-anchor="middle" class="label" fill="#00D4AA">TensorFlow</text>

        <rect x="395" y="18" width="90" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="440" y="40" text-anchor="middle" class="label" fill="#00D4AA">OpenCV</text>

        <rect x="500" y="18" width="80" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="540" y="40" text-anchor="middle" class="label" fill="#00D4AA">NumPy</text>

        <rect x="595" y="18" width="85" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="638" y="40" text-anchor="middle" class="label" fill="#00D4AA">Pandas</text>

        <rect x="695" y="18" width="70" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="730" y="40" text-anchor="middle" class="label" fill="#00D4AA">NLP</text>

        <rect x="780" y="18" width="80" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="820" y="40" text-anchor="middle" class="label" fill="#00D4AA">Groq AI</text>

        <rect x="875" y="18" width="110" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="930" y="40" text-anchor="middle" class="label" fill="#00D4AA">Gen AI / LLM</text>
      </g>
      <!-- Duplicate for seamless loop -->
      <g transform="translate(1000,0)">
        <rect x="30"  y="18" width="90" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="75"  y="40" text-anchor="middle" class="label" fill="#00D4AA">Python</text>

        <rect x="135" y="18" width="110" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="190" y="40" text-anchor="middle" class="label" fill="#00D4AA">scikit-learn</text>

        <rect x="260" y="18" width="120" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="320" y="40" text-anchor="middle" class="label" fill="#00D4AA">TensorFlow</text>

        <rect x="395" y="18" width="90" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="440" y="40" text-anchor="middle" class="label" fill="#00D4AA">OpenCV</text>

        <rect x="500" y="18" width="80" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="540" y="40" text-anchor="middle" class="label" fill="#00D4AA">NumPy</text>

        <rect x="595" y="18" width="85" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="638" y="40" text-anchor="middle" class="label" fill="#00D4AA">Pandas</text>

        <rect x="695" y="18" width="70" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="730" y="40" text-anchor="middle" class="label" fill="#00D4AA">NLP</text>

        <rect x="780" y="18" width="80" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="820" y="40" text-anchor="middle" class="label" fill="#00D4AA">Groq AI</text>

        <rect x="875" y="18" width="110" height="34" rx="8" fill="#0f1f1a" stroke="#00D4AA" stroke-width="1.2"/>
        <text x="930" y="40" text-anchor="middle" class="label" fill="#00D4AA">Gen AI / LLM</text>
      </g>
    </g>
  </g>

  <!-- Row 2: Web chips (reverse scroll direction) -->
  <g clip-path="url(#clip2)">
    <g style="animation: slideLeft 22s linear infinite reverse;">
      <g>
        <rect x="30"  y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="75"  y="110" text-anchor="middle" class="label" fill="#58A6FF">React</text>

        <rect x="135" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="180" y="110" text-anchor="middle" class="label" fill="#58A6FF">FastAPI</text>

        <rect x="240" y="88" width="75"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="278" y="110" text-anchor="middle" class="label" fill="#58A6FF">Flask</text>

        <rect x="330" y="88" width="80"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="370" y="110" text-anchor="middle" class="label" fill="#58A6FF">HTML/CSS</text>

        <rect x="425" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="470" y="110" text-anchor="middle" class="label" fill="#58A6FF">SQLite</text>

        <rect x="530" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="575" y="110" text-anchor="middle" class="label" fill="#58A6FF">MySQL</text>

        <rect x="635" y="88" width="100" height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="685" y="110" text-anchor="middle" class="label" fill="#58A6FF">MongoDB</text>

        <rect x="750" y="88" width="80"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="790" y="110" text-anchor="middle" class="label" fill="#58A6FF">Git/GitHub</text>

        <rect x="845" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="890" y="110" text-anchor="middle" class="label" fill="#58A6FF">JavaScript</text>
      </g>
      <g transform="translate(1000,0)">
        <rect x="30"  y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="75"  y="110" text-anchor="middle" class="label" fill="#58A6FF">React</text>

        <rect x="135" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="180" y="110" text-anchor="middle" class="label" fill="#58A6FF">FastAPI</text>

        <rect x="240" y="88" width="75"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="278" y="110" text-anchor="middle" class="label" fill="#58A6FF">Flask</text>

        <rect x="330" y="88" width="80"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="370" y="110" text-anchor="middle" class="label" fill="#58A6FF">HTML/CSS</text>

        <rect x="425" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="470" y="110" text-anchor="middle" class="label" fill="#58A6FF">SQLite</text>

        <rect x="530" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="575" y="110" text-anchor="middle" class="label" fill="#58A6FF">MySQL</text>

        <rect x="635" y="88" width="100" height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="685" y="110" text-anchor="middle" class="label" fill="#58A6FF">MongoDB</text>

        <rect x="750" y="88" width="80"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="790" y="110" text-anchor="middle" class="label" fill="#58A6FF">Git/GitHub</text>

        <rect x="845" y="88" width="90"  height="34" rx="8" fill="#111827" stroke="#58A6FF" stroke-width="1.2"/>
        <text x="890" y="110" text-anchor="middle" class="label" fill="#58A6FF">JavaScript</text>
      </g>
    </g>
  </g>

  <!-- Separator -->
  <line x1="28" y1="76" x2="1172" y2="76" stroke="#21262d" stroke-width="1"/>
</svg>
